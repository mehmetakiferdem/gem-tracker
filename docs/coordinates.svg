<svg xmlns="http://www.w3.org/2000/svg" width="840" height="460" viewBox="0 0 840 460" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c2230"/>
      <stop offset="100%" stop-color="#161b26"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#fbbf77"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="840" height="460" rx="10" fill="url(#bg)"/>

  <text x="420" y="38" fill="#e6edf3" font-size="16" font-weight="600" text-anchor="middle">Normalised offset</text>
  <text x="420" y="60" fill="#7d8799" font-size="13" text-anchor="middle">1280 &#215; 720 drawing frame</text>

  <!-- frame -->
  <rect x="190" y="100" width="460" height="259" rx="6" fill="#11151f" stroke="#3a4457" stroke-width="1.5"/>

  <!-- centre axes -->
  <line x1="190" y1="230" x2="650" y2="230" stroke="#3a4457" stroke-width="1" stroke-dasharray="5 5"/>
  <line x1="420" y1="100" x2="420" y2="359" stroke="#3a4457" stroke-width="1" stroke-dasharray="5 5"/>

  <!-- bbox -->
  <rect x="489" y="201" width="55" height="115" fill="none" stroke="#7dd3fc" stroke-width="2"/>
  <text x="489" y="193" fill="#7dd3fc" font-size="12" font-family="ui-monospace, Menlo, Consolas, monospace">id=1</text>

  <!-- dx / dy arrows -->
  <line x1="420" y1="230" x2="517" y2="230" stroke="#fbbf77" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="517" y1="230" x2="517" y2="259" stroke="#fbbf77" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="466" y="220" fill="#fbbf77" font-size="12.5" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">dx = +0.42</text>
  <text x="556" y="264" fill="#fbbf77" font-size="12.5" font-family="ui-monospace, Menlo, Consolas, monospace">dy = +0.22</text>

  <!-- object centre -->
  <circle cx="517" cy="259" r="4.5" fill="#fbbf77"/>

  <!-- frame centre -->
  <circle cx="420" cy="230" r="5" fill="none" stroke="#5eead4" stroke-width="2"/>
  <circle cx="420" cy="230" r="1.8" fill="#5eead4"/>
  <text x="410" y="252" fill="#5eead4" font-size="12.5" text-anchor="end" font-family="ui-monospace, Menlo, Consolas, monospace">0.0 , 0.0</text>

  <!-- edge labels -->
  <text x="178" y="235" fill="#a3b1c6" font-size="13" text-anchor="end" font-family="ui-monospace, Menlo, Consolas, monospace">dx = &#8722;1.0</text>
  <text x="662" y="235" fill="#a3b1c6" font-size="13" font-family="ui-monospace, Menlo, Consolas, monospace">dx = +1.0</text>
  <text x="420" y="90" fill="#a3b1c6" font-size="13" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">dy = &#8722;1.0</text>
  <text x="420" y="379" fill="#a3b1c6" font-size="13" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">dy = +1.0</text>

  <text x="420" y="424" fill="#7d8799" font-size="12.5" text-anchor="middle">The image y axis grows downwards, so a positive dy means the target is below the centre.</text>
</svg>
