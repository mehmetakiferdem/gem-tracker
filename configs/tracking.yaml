# ===========================================================================
#  TRACKING -- the single config file
#
#  Before you run it, change the two lines in the SETTING sections below:
#    1) track_mode     -> how to track
#    2) track_classes  -> what to track
#
#  Run:
#    ./app_edgeai.py ../configs/tracking.yaml -n     (coordinate output)
#    ./app_edgeai.py ../configs/tracking.yaml        (fps table)
#
#  Viewing (on the VM). VLC DOES NOT WORK, it wants an SDP file for raw RTP:
#    gst-launch-1.0 udpsrc port=5000 \
#      caps="application/x-rtp,media=video,encoding-name=H264,payload=96,clock-rate=90000" \
#      ! rtpjitterbuffer latency=0 ! rtph264depay ! avdec_h264 \
#      ! autovideosink sync=false
#
#  The badge on the top left of the frame says what is happening right now:
#    SEARCHING            no target, searching             (blue)
#    LOCKED id=3          locked onto a single target       (green)
#    TRACKING: 4 objects  multi mode, 4 objects tracked     (green)
#
#  When shutting down ALWAYS use Ctrl+C and wait for "APP: Deinit ... Done !!!".
#  A dirty exit locks up TIOVX and the only cleanup is a reboot.
# ===========================================================================

title: "Tracking"
log_level: 2

inputs:
    input0:
        source: /dev/video-imx219-cam0
        format: rggb
        width: 1920
        height: 1080
        framerate: 30
        subdev-id: /dev/v4l-imx219-subdev0

models:
    model0:
        # FACE tracking (WIDER FACE, one class: face). For whole-body
        # tracking put the COCO model back and set track_classes: [person]
        # and servo_aim_y: 0.15 below:
        #   model_path: /opt/model_zoo/TFL-OD-2020-ssdLite-mobDet-DSP-coco-320x320
        model_path: /opt/model_zoo/ONR-OD-8420-yolox-s-lite-mmdet-widerface-640x640

        # =================== SETTING 1: TRACKING MODE =====================
        #
        # lock    Locks onto a single target and reports only that one. The
        #         lock survives an identity change. Detection still runs on
        #         every frame (on the C7x, so it costs the A53 nothing).
        #         MEASURED: 29.13 fps on a live camera, 22.19 fps on file input.
        #         >>> This is the right mode for gimbal / servo tracking. <<<
        #
        # multi   No lock. EVERY object in the frame gets its own id and all
        #         of their coordinates are printed. For observing a scene,
        #         counting, or seeing how many objects there are.
        #         MEASURED: slightly below lock mode.
        #
        track_mode: lock

        # =================== SETTING 2: WHAT TO TRACK ======================
        #
        # A list of class names. More than one can be given:
        #     track_classes: [person, dog]
        # An empty list tracks every class:
        #     track_classes: []
        #
        # A wrong name prints a warning at startup along with examples of the
        # valid names; it never silently tracks the wrong thing.
        #
        # The model is trained on COCO-80. Available names:
        #
        #   PEOPLE/ANIMALS  person, cat, dog, horse, sheep, cow, elephant,
        #                   bear, zebra, giraffe, bird
        #   VEHICLES        car, truck, bus, motorcycle, bicycle, train,
        #                   airplane, boat
        #   OBJECTS         backpack, umbrella, handbag, tie, suitcase,
        #                   bottle, cup, fork, knife, spoon, bowl, chair,
        #                   couch, bed, dining table, toilet, tv, laptop,
        #                   mouse, remote, keyboard, cell phone, microwave,
        #                   oven, sink, refrigerator, book, clock, vase,
        #                   scissors, teddy bear, potted plant
        #   SPORTS          sports ball, frisbee, skis, snowboard, kite,
        #                   baseball bat, skateboard, surfboard, tennis racket
        #   FOOD            banana, apple, sandwich, orange, broccoli, carrot,
        #                   hot dog, pizza, donut, cake
        #   TRAFFIC         traffic light, fire hydrant, stop sign,
        #                   parking meter, bench
        #
        track_classes: [face]        # [person] with the COCO model

        # =================== FINE TUNING ==================================
        # It works without touching any of these.

        # Detection confidence threshold. Lowering it catches more objects but
        # also raises false positives. The detector gets noisy at low
        # confidence.
        viz_threshold: 0.5           # 0.6 with the COCO person model

        # How many frames an identity survives without a matching detection
        # (at 30 fps, 30 = 1 s). The old value was 5 and even a person standing
        # still changed identity a few times per minute. Raise it if you lose
        # the target during brief occlusions.
        hit_counter_max: 30

        # Frames required before an object counts as "real". A false-positive
        # filter; raising it helps in a noisy scene but delays locking onto
        # the target.
        initialization_delay: 4

        # In lock mode, which candidate is picked while there is no lock:
        #   closest_to_center  the one needing the least pan/tilt movement
        #   largest            the biggest box, usually the nearest object
        #   first              the first in the list, the cheapest
        lock_policy: closest_to_center

        # Detection to track matching. diou keeps matching a face that moved
        # more than its own width since the last frame (14 fps, head turn),
        # where iou gave up and renamed it; tools/sim_tracking.py measured
        # 6-15 renames per 240 frames with iou at 30-60 px/frame, ~1 with
        # diou 1.5 and kalman_q 5, and no id swaps between crossing faces.
        match_distance: diou         # diou | iou (the old behaviour, threshold 1.0)
        match_threshold: 1.5
        kalman_q: 5.0                # Kalman process noise: higher learns speed faster

        # Taking a lost lock over: the new box within lock_reacquire_sizes of
        # the old box's size, and no more than lock_reacquire_scale larger or
        # smaller, compared in world coordinates while the servos run.
        lock_reacquire_sizes: 4.0
        lock_reacquire_scale: 2.0

        enable_tracking: True

        # Run inference on both C7x cores, alternate frames on each.
        # MEASURED with the face model (servos off): 1 core 14.2 fps, 54 ms
        # per inference; 2 cores 20.0 fps, but 87 ms per inference as the two
        # share DDR bandwidth. So more updates, each from a slightly older
        # picture. Left at 1: on the rig the extra latency made the picture
        # lag and the servos unsteady. With 2 use servo_gain 0.15,
        # servo_max_step 1.9 and servo_motion_delay 3 (untested on the rig).
        infer_cores: 1

        # Browser view of the output with boxes and badge, MJPEG:
        #   http://192.168.7.2:8080/   over the USB cable
        #   http://<wlan0 address>:8080/  over Wi-Fi
        # 0 turns it off. Costs nothing while no browser is open.
        web_view_port: 8080

        # Local panel. "" turns it off. The Waveshare 5" DSI LCD here is the
        # 800x480 Raspberry Pi compatible one (overlay
        # k3-am67a-t3-gem-o1-dsi-rpi-7inch-panel.dtbo), landscape, so no
        # rotation; the picture is scaled to fit. 90/180/270 for a panel
        # mounted another way (the rotation applies to the panel only).
        # /dev/dri/card0 drives every connected display (DSI + HDMI) at its
        # own resolution through KMS; /dev/fb0 shares one framebuffer sized
        # to the largest display, so the panel shows only a corner of it
        # while a TV is connected.
        display_fb: /dev/dri/card0
        display_rotate: 0
        # Touchscreen: tap a face to lock onto it, tap elsewhere to release.
        # auto finds the FT5x06 of this panel, "" turns it off.
        display_touch: auto
        # FPS and the load of each A53 core and C7x DSP, in a box at the top
        # right of the HDMI TV picture (only with /dev/dri, never on the
        # panel or the web view). The C7x marked AI runs the detector.
        display_perf: True
        # Picture style at start: plain | aim | night | thermal (see hud.py).
        # The round buttons on the panel switch it while running.
        hud_style: aim

        # =================== PAN/TILT SERVO ================================
        # hwpwm  hardware PWM, no jitter (default). epwm1 = 23010000.pwm,
        #        channel 0 = GPIO6 (pin 31), channel 1 = GPIO13 (pin 33).
        #        Needs overlay k3-am67a-t3-gem-o1-pwm-epwm1-gpio6-gpio13.dtbo
        #        in /boot/uEnv.txt.
        # lgpio  software PWM, pan GPIO17 / tilt GPIO27 (old wiring).
        servo_backend: hwpwm
        servo_pan_pwm_channel: 0     # GPIO6  (2026-09-24: measured, channel 0 is the horizontal axis)
        servo_tilt_pwm_channel: 1    # GPIO13 (channel 1 moves the picture vertically, 29 px/deg)
        # Seconds at rest before the pulses are cut, 0 = always hold.
        servo_release_after: 0
        #
        # Direction. dx > 0 (target right) lowers the pan angle, dy > 0
        # (target below) lowers the tilt angle. If an axis runs AWAY from the
        # target, flip its invert flag.
        servo_pan_invert: False    # 2026-09-24: True ran away on channel 0 in both directions; False converged
        servo_tilt_invert: True    # 2026-09-24 measured: +1 deg on channel 1 moves the picture up

        # Aim point inside the box, fraction of its height from the top.
        # 0.15 = head of a person, 0.5 = box centre.
        servo_aim_y: 0.5             # face box centre; 0.15 for a person box

        # Fraction of the error corrected per frame. Higher is faster but
        # starts to overshoot and oscillate (camera latency). 0.08 - 0.15.
        servo_gain: 0.20             # per frame: 0.20 at 14 fps (one C7x), 0.15 at 20 fps (two)
        # Largest single move, degrees per frame (1.5 at 30 fps = 45 deg/s).
        servo_max_step: 2.5          # per frame: 2.5 at 14 fps = 1.9 at 20 fps, ~37 deg/s either way
        # Normalized error treated as centred (0.03 = 3% of half the frame).
        servo_deadzone: 0.03
        # Hysteresis: once centred (inside servo_deadzone) an axis stays
        # still until the error passes this; stops the one-step twitching of
        # a centred target.
        servo_deadzone_exit: 0.05
        # servo_gain and servo_max_step are per frame at this frame rate;
        # the loop scales every step by the real time between frames, so it
        # behaves the same at 14 or 20 fps (tools/sim_servo.py: at 20 fps the
        # old per frame loop overshot a 12 degree jump by 3.2 degrees, this
        # one by 1.2).
        servo_ref_fps: 14
        # Velocity feed forward, seconds: the picture is ~0.13 s old, so the
        # error is moved ahead along the target's own speed (world frame,
        # camera motion removed). Simulated: tracking error on a swaying
        # target 3.0 -> 2.3 degrees at 0.08, 1.9 at 0.13. 0 turns it off.
        servo_lead: 0.10
        # Camera field of view in degrees, turns the error into an angle.
        # IMX219 1920x1080 mode with the stock lens is about 40 x 23.
        servo_hfov: 40
        servo_vfov: 23
        # Log every locked frame ([SERVO] lines): score, live, error, angles.
        servo_debug: False
        # Frames between a servo command and the first picture that shows it
        # (capture plus inference, ~130 ms with two cores). 2 at 14 fps with
        # one core, 3 at 20 fps with two.
        servo_motion_delay: 2

        # Search. With no target the rig first holds still where the target
        # was lost for servo_search_delay seconds, then sweeps the pan axis
        # back and forth between the servo_search_pan limits, starting towards
        # the side the target left on, with tilt at servo_search_tilt. The
        # sweep is stop and go, servo_search_step degrees then
        # servo_search_dwell seconds still: a camera in motion blurs indoors
        # and the detector finds nothing in blurred frames.
        servo_search: True
        servo_search_delay: 1.0      # seconds
        servo_search_step: 10        # degrees per hop (FOV is ~40)
        servo_search_dwell: 0.8      # seconds still after each hop
        servo_search_pan: [-60, 60]  # degrees
        servo_search_tilt: 0         # degrees, raise it if the camera looks too low

outputs:
    output0:
        sink: remote
        width: 1280
        height: 720
        port: 5000
        host: 192.168.200.2         # B (display) board over the mesh
        encoding: h264-rtp
        bitrate: 2000000
        gop-size: 30
        # overlay-perf-type is left undefined ON PURPOSE. Adding it brings back
        # TI's demo decorations (title, FPS/TEMP readout, bar graphs).

    # To write the same frames to disk. To use it, put output1 instead of
    # output0 in the flows section below.
    output1:
        sink: /opt/edgeai-test-data/output/tracking.mkv
        width: 1280
        height: 720

flows:
    flow0: [input0,model0,output0,[0,0,1280,720]]
